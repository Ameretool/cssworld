<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS World - 探索 CSS 的无限可能</title>
    <style>
        :root {
            --bg-color: #f9fafb;
            --text-main: #111827;
            --text-muted: #6b7280;
            --card-bg: #ffffff;
            --card-disabled: #f3f4f6;
            --card-border: #e5e7eb;
            --accent: #3b82f6;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #111827;
                --text-main: #f9fafb;
                --text-muted: #9ca3af;
                --card-bg: #1f2937;
                --card-disabled: #1f2937;
                --card-border: #374151;
                --accent: #60a5fa;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 4rem 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            letter-spacing: -0.05em;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 500px;
            line-height: 1.6;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 900px;
        }

        /* 卡片通用样式 */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1.5rem;
            text-decoration: none;
            color: inherit;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 禁用/置灰状态 */
        .card.disabled {
            background-color: var(--card-disabled);
            opacity: 0.6;
            cursor: not-allowed;
            pointer-events: none;
        }

        .icon {
            font-size: 2rem;
            margin-bottom: 1rem;
            filter: grayscale(100%);
        }

        h2 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 1.5rem;
            flex-grow: 1;
        }

        /* 状态标签 */
        .tag {
            align-self: flex-start;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            background-color: var(--card-border);
            color: var(--text-muted);
        }

        footer {
            margin-top: 4rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>CSS World</h1>
        <p class="subtitle">探索、收集与创造最纯粹的 CSS 网页效果。目前正在施工中，敬请期待。</p>
    </header>

    <main class="grid">
        <!-- 模块 1：动画库 -->
        <div class="card disabled">
            <div class="icon">🎬</div>
            <h2>CSS 动画库</h2>
            <p class="desc">自动收录优质的纯 CSS 动画，支持一键复制与实时预览。</p>
            <span class="tag">规划中 / anim.css.world</span>
        </div>

        <!-- 模块 2：实用生成器 -->
        <div class="card disabled">
            <div class="icon">🛠️</div>
            <h2>实用生成器</h2>
            <p class="desc">可视化配置 box-shadow、渐变、玻璃拟态，直接生成可用代码。</p>
            <span class="tag">规划中 / tools.css.world</span>
        </div>

        <!-- 模块 3：灵感与教程 -->
        <div class="card disabled">
            <div class="icon">💡</div>
            <h2>灵感与教程</h2>
            <p class="desc">收集优秀的网页设计案例，拆解背后的 CSS 布局与技巧。</p>
            <span class="tag">规划中 / docs.css.world</span>
        </div>
    </main>

    <footer>
        &copy; 2024 CSS World. All rights reserved.
    </footer>

</body>
</html>
